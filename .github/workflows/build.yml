name: Build Better Sprint

on:
  push:
    branches: [ "arena/**", "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: "1.7.10-forge",    java: "8\n17", gradle: "8.8",  experimental: true  }
          - { target: "1.12.2-forge",    java: "8",     gradle: "7.6.4", experimental: false }
          - { target: "1.20.1-forge",    java: "17",    gradle: "8.8",  experimental: false }
          - { target: "1.20.1-fabric",   java: "17",    gradle: "8.8",  experimental: false }
          - { target: "1.21.1-forge",    java: "21",    gradle: "8.8",  experimental: false }
          - { target: "1.21.1-fabric",   java: "21",    gradle: "8.8",  experimental: false }
          - { target: "1.21.1-neoforge", java: "21",    gradle: "8.8",  experimental: false }
          - { target: "1.21.11-fabric",  java: "21",    gradle: "8.10.2", experimental: true }
          - { target: "1.21.11-neoforge",java: "21",    gradle: "8.10.2", experimental: true }
          - { target: "26.3-fabric",     java: "21",    gradle: "9.1.0", experimental: true }
          - { target: "26.3-neoforge",   java: "21",    gradle: "9.1.0", experimental: true }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Build
        working-directory: versions/${{ matrix.target }}
        run: gradle build --no-daemon --stacktrace

      - name: Collect jar
        working-directory: versions/${{ matrix.target }}
        run: |
          mkdir -p out
          find build/libs -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev*.jar' \
               ! -name '*-slim*.jar' ! -name '*-shadow*.jar' -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: BetterSprint-${{ matrix.target }}
          path: versions/${{ matrix.target }}/out/*.jar
          if-no-files-found: error

  bundle:
    name: Bundle all jars
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars
      - run: find jars -type f -name '*.jar' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: BetterSprint-ALL
          path: jars/**/*.jar
          if-no-files-found: warn
