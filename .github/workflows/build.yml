name: Build Better Sprint

on:
  push:
    branches: [ "arena/**", "main" ]
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: "1.7.10-forge",    java: "8\n17", gradle: "8.8",  experimental: true  }
          - { target: "1.12.2-forge",    java: "8",     gradle: "7.6.4", experimental: false }
          - { target: "1.20.1-forge",    java: "17",    gradle: "8.8",  experimental: false }
          - { target: "1.20.1-fabric",   java: "17",    gradle: "8.8",  experimental: false }
          - { target: "1.21.1-forge",    java: "21",    gradle: "8.8",  experimental: false }
          - { target: "1.21.1-fabric",   java: "21",    gradle: "8.8",  experimental: false }
          - { target: "1.21.1-neoforge", java: "21",    gradle: "8.8",  neo: "21.1.", experimental: false }
          - { target: "1.21.11-fabric",  java: "21",    gradle: "8.14.3", experimental: true }
          - { target: "1.21.11-neoforge",java: "21",    gradle: "8.14.3", neo: "21.11.", experimental: true }
          - { target: "26.3-fabric",     java: "25",    gradle: "9.7.0", experimental: true }
          - { target: "26.3-neoforge",   java: "25",    gradle: "9.7.0", neo: "26.3.", experimental: true }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ matrix.gradle }}

      - name: Resolve NeoForge version
        if: matrix.neo != ''
        working-directory: versions/${{ matrix.target }}
        run: |
          curl -s https://maven.neoforged.net/releases/net/neoforged/neoforge/maven-metadata.xml -o meta.xml
          VER=$(grep -oP '(?<=<version>)[^<]+' meta.xml | grep "^${{ matrix.neo }}" | grep -viE 'beta|alpha' | tail -1)
          if [ -z "$VER" ]; then VER=$(grep -oP '(?<=<version>)[^<]+' meta.xml | grep "^${{ matrix.neo }}" | tail -1); fi
          echo "Using NeoForge $VER"
          echo "neoforgeVersion=$VER" >> gradle.properties
          rm -f meta.xml

      - name: Build
        id: build
        working-directory: versions/${{ matrix.target }}
        run: set -o pipefail; gradle build --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish failure log
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: versions/${{ matrix.target }}
        run: |
          LOG=$( { grep -nE "error:|warning: .*deprecat|Could not |FAILURE:|Caused by: [A-Za-z]" build.log | head -40; echo "---- what went wrong ----"; sed -n '/What went wrong/,/^\* Try/p' build.log | head -60; echo "---- tail ----"; tail -c 3000 build.log; } 2>/dev/null || echo "no build.log")
          printf '### %s failed (run %s)\n```\n%s\n```\n' "${{ matrix.target }}" "${{ github.run_id }}" "$LOG" > comment.md
          python3 -c "import json,os;print(json.dumps({'body':open('comment.md').read()}))" > comment.json
          gh api repos/${{ github.repository }}/issues/1/comments --input comment.json || true

      - name: Collect jar
        working-directory: versions/${{ matrix.target }}
        run: |
          mkdir -p out
          find build/libs -name '*.jar' ! -name '*-sources.jar' ! -name '*-dev*.jar' \
               ! -name '*-slim*.jar' ! -name '*-shadow*.jar' -exec cp {} out/ \;
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: BetterSprint-${{ matrix.target }}
          path: versions/${{ matrix.target }}/out/*.jar
          if-no-files-found: error

  bundle:
    name: Bundle all jars
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: jars
      - run: find jars -type f -name '*.jar' | sort
      - uses: actions/upload-artifact@v4
        with:
          name: BetterSprint-ALL
          path: jars/**/*.jar
          if-no-files-found: warn

      - name: Flatten jars
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release
          find jars -name '*.jar' -exec cp {} release/ \; || true
          { echo "### bundle diag"; echo '```'; find jars -type f | head -50; echo "--- release:"; ls -l release; echo '```'; } > d.md
          python3 -c "import json;print(json.dumps({'body':open('d.md').read()}))" > d.json
          gh api repos/${{ github.repository }}/issues/1/comments --input d.json || true

      - name: Publish release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          TAG="v1.0.0-build${{ github.run_number }}"
          gh release create "$TAG" release/*.jar \
            --repo "${{ github.repository }}" \
            --title "Better Sprint 1.0.0 (build ${{ github.run_number }})" \
            --notes "Better Sprint by Bogdan_Tokarev - client-side sprint acceleration mod." \
            --target "${{ github.sha }}" > rel.log 2>&1
          echo "exit=$?" >> rel.log
          python3 -c "import json;print(json.dumps({'body':'### release step\n```\n'+open('rel.log').read()[-5000:]+'\n```'}))" > c.json
          gh api repos/${{ github.repository }}/issues/1/comments --input c.json
          gh release view "$TAG" --repo "${{ github.repository }}" > /dev/null
